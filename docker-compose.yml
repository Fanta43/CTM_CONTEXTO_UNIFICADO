# Entorno de desarrollo que imita al servidor torito (172.16.1.223):
#   Ubuntu 26.04 / nginx 1.28 / PHP 8.5 (fpm) / MariaDB 11.8
# Uso:  docker compose up -d      (levantar)
#       docker compose down       (bajar, conserva la base)
#       docker compose down -v    (bajar y borrar la base)
# Web:      https://localhost:8080/ctm/contexto_unificado/   (certificado autofirmado: aceptar el aviso del navegador)
# Adminer:  http://localhost:8081   (servidor: db, usuario: root, clave: ctm_dev)

services:
  web:
    image: nginx:1.28
    ports:
      - "8080:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ctm_certs:/etc/nginx/certs
      - .:/var/www/ctm/contexto_unificado
    # genera el certificado autofirmado la primera vez y arranca nginx
    command: >
      sh -c "mkdir -p /etc/nginx/certs
      && ([ -f /etc/nginx/certs/dev.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 3650
          -subj '/CN=localhost' -keyout /etc/nginx/certs/dev.key -out /etc/nginx/certs/dev.crt)
      && exec nginx -g 'daemon off;'"
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-ctm.ini:ro
      - .:/var/www/ctm/contexto_unificado
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ctm_dev
      MARIADB_DATABASE: contexto_unificado
    ports:
      - "3307:3306"
    volumes:
      - ctm_db:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  ctm_db:
  ctm_certs:
