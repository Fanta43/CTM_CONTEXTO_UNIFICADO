# Entorno de desarrollo que imita al servidor torito (172.16.1.223):
#   Ubuntu 26.04 / nginx 1.28 / PHP 8.5 (fpm) / MariaDB 11.8
# Uso:  docker compose up -d      (levantar)
#       docker compose down       (bajar, conserva la base)
#       docker compose down -v    (bajar y borrar la base)
# Web:      http://localhost:8080/ctm/contexto_unificado/
# Adminer:  http://localhost:8081   (servidor: db, usuario: root, clave: ctm_dev)

services:
  web:
    image: nginx:1.28
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/ctm/contexto_unificado
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-ctm.ini:ro
      - .:/var/www/ctm/contexto_unificado
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ctm_dev
      MARIADB_DATABASE: contexto_unificado
    ports:
      - "3307:3306"
    volumes:
      - ctm_db:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  ctm_db:
