# nginx local, misma familia que torito. El repo se monta en /var/www/ctm/contexto_unificado
# Sirve HTTPS con certificado autofirmado porque la aplicacion fuerza HTTPS (ctm_entorno/default.php).
# El puerto 8080 de la notebook llega aca al 443: http://localhost:8080 redirige solo a https://localhost:8080
server {
    listen 443 ssl;
    server_name localhost;
    root /var/www;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # peticion HTTP plana en el puerto HTTPS -> redirigir a https en el mismo puerto
    error_page 497 =301 https://$host:$server_port$request_uri;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(git|env) {
        deny all;
    }
}
